planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    GridBased:
      plugin: 'nav2_navfn_planner::NavfnPlanner' # In Iron and older versions, "/" was used instead of "::"
      use_astar: True
      allow_unknown: True
      tolerance: 1.0


smoother_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-5          # realistic convergence threshold
      max_its: 200               # maximum iterations per smoothing
      refinement_num: 20         # number of refinement passes
      enforce_path_inversion: True  # preserves directional changes
      do_refinement: True        # enable iterative refinement

